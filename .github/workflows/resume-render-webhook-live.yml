name: Resume Render Webhook Sender (LIVE)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "START_DRAIN_ONLY" to resume with Telegram sends disabled for backlog drain.'
        required: true
        default: 'NO'
      warmup_seconds:
        description: 'Seconds to keep Telegram sends disabled after resume before enabling live sends'
        required: true
        default: '300'
      enable_after_warmup:
        description: 'Set to true only after verifying the app does not queue historical backlog messages'
        required: true
        default: 'false'
      service_id:
        description: 'Optional: Render Service ID to resume (if blank uses repo secret SERVICE_ID)'
        required: false
        default: ''

jobs:
  resume-live-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/resume-render-webhook-live.sh

      - name: Require explicit live confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "START_DRAIN_ONLY" ]; then
            echo "Confirmation is not START_DRAIN_ONLY; exiting without changes."
            exit 1
          fi
          if [ "${{ github.event.inputs.enable_after_warmup }}" = "true" ]; then
            echo "Automatic live enable is blocked after repeated backlog storms."
            echo "Run drain-only first, inspect Render logs, then enable sends manually only after the app is quiet."
            exit 1
          fi

      - name: Resume Render with webhook sends enabled
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOYVERSE_WEBHOOK_SECRET: ${{ secrets.LOYVERSE_WEBHOOK_SECRET }}
          WARMUP_SECONDS: ${{ github.event.inputs.warmup_seconds }}
          ENABLE_AFTER_WARMUP: ${{ github.event.inputs.enable_after_warmup }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.service_id }}" != "" ]; then
            SERVICE_ID="${{ github.event.inputs.service_id }}"
          else
            SERVICE_ID="${{ secrets.SERVICE_ID }}"
          fi
          export SERVICE_ID
          ./scripts/resume-render-webhook-live.sh
