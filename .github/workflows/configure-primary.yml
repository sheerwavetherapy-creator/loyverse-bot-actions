name: Configure Primary Render Sender (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "YES" to run the configuration (required)'
        required: true
        default: 'NO'
      service_id:
        description: 'Optional: the Render Service ID to configure (if blank uses repo secret SERVICE_ID)'
        required: false
        default: ''

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/configure-primary-render.sh

      - name: Require explicit confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "YES" ]; then
            echo "Confirmation not YES — exiting without changes."
            exit 1
          fi

      - name: Configure primary sender via script
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer explicit input service_id; fall back to repo secret SERVICE_ID
          if [ "${{ github.event.inputs.service_id }}" != "" ]; then
            SERVICE_ID="${{ github.event.inputs.service_id }}"
          else
            SERVICE_ID="${{ secrets.SERVICE_ID }}"
          fi
          export SERVICE_ID
          ./scripts/configure-primary-render.sh
