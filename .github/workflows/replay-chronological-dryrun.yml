name: Replay Chronological (dry-run)

on:
  workflow_dispatch:
    inputs:
      cutoff_receipt:
        description: 'Optional LOYVERSE_REPLAY_CUTOFF_RECEIPT (e.g. 1-4167). Leave blank to use repo secrets or defaults.'
        required: false
        default: ''
      dry_run:
        description: 'Set to "true" to ensure this run is a dry-run'
        required: true
        default: 'true'

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Run chronological recovery (dry-run)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
          LOYVERSE_REPLAY_CUTOFF_RECEIPT: ${{ github.event.inputs.cutoff_receipt || secrets.LOYVERSE_REPLAY_CUTOFF_RECEIPT || '' }}
          ENABLE_TELEGRAM_SENDS: 'false'
        run: |
          set -euo pipefail
          # enforce dry-run flag for safety
          npm run recover:chronological -- --dry-run

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronological-replay-artifacts
          path: |
            data/*.json
            replay-output/*.json
            logs/*.log
          if-no-files-found: ignore
