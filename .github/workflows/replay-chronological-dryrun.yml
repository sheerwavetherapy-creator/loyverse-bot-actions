name: Replay Chronological (dry-run)

on:
  workflow_dispatch:
    inputs:
      cutoff_receipt:
        description: 'Optional LOYVERSE_REPLAY_CUTOFF_RECEIPT (e.g. 1-4167). Leave blank to use repo secrets or defaults.'
        required: false
        default: ''
      dry_run:
        description: 'Set to "true" to ensure this run is a dry-run'
        required: true
        default: 'true'

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery workflow
        uses: actions/checkout@v4

      - name: Checkout Loyverse-Bot
        uses: actions/checkout@v4
        with:
          repository: sheerwavetherapy-creator/Loyverse-Bot
          token: ${{ secrets.LOYVERSE_BOT_REPO_TOKEN }}
          path: app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: app
        run: npm install

      - name: Build
        working-directory: app
        run: npm run build

      - name: Run chronological recovery (dry-run)
        working-directory: app
        env:
          LOYVERSE_API_TOKEN: ${{ secrets.LOYVERSE_API_TOKEN }}
          LOYVERSE_WEBHOOK_SECRET: ${{ secrets.LOYVERSE_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOYVERSE_REPLAY_CUTOFF_RECEIPT: ${{ github.event.inputs.cutoff_receipt || secrets.LOYVERSE_REPLAY_CUTOFF_RECEIPT || '' }}
          ENABLE_TELEGRAM_SENDS: 'false'
          ALLOW_HISTORICAL_RECOVERY: 'true'
        run: |
          set -euo pipefail
          # enforce dry-run flag for safety
          : "${LOYVERSE_REPLAY_CUTOFF_RECEIPT:?Set cutoff_receipt or LOYVERSE_REPLAY_CUTOFF_RECEIPT before running recovery.}"
          # pass the cutoff receipt via --after-receipt (required; the script does not read it from the env)
          npm run recover:chronological -- --dry-run --after-receipt "$LOYVERSE_REPLAY_CUTOFF_RECEIPT"

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronological-replay-artifacts
          path: |
            app/data/*.json
            app/replay-output/*.json
            app/logs/*.log
          if-no-files-found: ignore
